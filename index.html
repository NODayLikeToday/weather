<!DOCTYPE html>
<html lang="en">
<head>
  <title>Weather Forecast</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #122A33;
      --sea: #1F6F78;
      --sea-deep: #0E4048;
      --mist: #F4F8F7;
      --card: #FFFFFF;
      --sand: #E3A542;
      --line: #DCE8E6;
      --muted: #5B7B80;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--mist);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 0 48px;
    }

    header.hero {
      background: linear-gradient(160deg, var(--sea) 0%, var(--sea-deep) 100%);
      color: #EAF4F3;
      padding: 32px 20px 40px;
      text-align: center;
    }

    .eyebrow {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 500;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      color: var(--sand);
      margin: 0 0 4px;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      margin: 0 0 20px;
      letter-spacing: -0.01em;
    }

    .clock-card {
      display: inline-flex;
      flex-direction: column;
      gap: 2px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      padding: 10px 22px;
      margin-bottom: 22px;
    }

    .clock-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #BFDEDB;
    }

    .clock-value {
      font-family: 'Fraunces', serif;
      font-size: 1.3rem;
      font-weight: 500;
    }

    .actions {
      display: flex;
      gap: 12px;
      max-width: 420px;
      margin: 0 auto;
    }

    .btn {
      flex: 1;
      appearance: none;
      border-radius: 999px;
      padding: 12px 16px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease;
    }

    .btn:active { transform: scale(0.97); }

    .btn-outline {
      background: transparent;
      border: 1.5px solid rgba(255, 255, 255, 0.55);
      color: #EAF4F3;
    }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.1); }

    .btn-solid {
      background: var(--sand);
      border: 1.5px solid var(--sand);
      color: #2A1B02;
    }
    .btn-solid:hover { background: #EFB35E; }

    .wave {
      display: block;
      width: 100%;
      height: 22px;
      margin-top: -1px;
    }

    main { padding: 28px 16px 0; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(18, 42, 51, 0.06), 0 8px 24px rgba(18, 42, 51, 0.06);
    }

    thead th {
      background: var(--sea-deep);
      color: #DCEFED;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 12px 10px;
      text-align: center;
    }

    tbody tr { border-top: 1px solid var(--line); }
    tbody tr:nth-child(even) { background: rgba(31, 111, 120, 0.035); }

    tbody th, tbody td {
      padding: 12px 10px;
      text-align: center;
      font-size: 0.92rem;
      vertical-align: middle;
    }

    tbody th {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      color: var(--sea-deep);
      white-space: nowrap;
    }

    tbody td:nth-child(2) { text-align: left; }

    .metric strong { display: block; font-size: 1rem; }
    .metric .sub { display: block; font-size: 0.74rem; color: var(--muted); margin-top: 1px; }

    .loc-sun { display: block; font-size: 0.74rem; color: var(--muted); margin-top: 2px; font-weight: 400; }

    /* Shown on the date cell when the requested forecast date was
       beyond the provider's range and the app fell back to the
       farthest available date instead. */
    .fallback-badge {
      display: inline-block;
      margin-left: 6px;
      font-size: 0.85rem;
      cursor: help;
      vertical-align: 1px;
      line-height: 1;
    }

    tr.today-row { position: relative; }
    tr.today-row th, tr.today-row td { background: rgba(227, 165, 66, 0.12); }
    tr.today-row th { box-shadow: inset 4px 0 0 var(--sand); }

    footer.note {
      text-align: center;
      font-size: 0.76rem;
      color: var(--muted);
      padding: 18px 16px 0;
    }

    /* --- Map --- */
    #map-section {
      max-width: 760px;
      margin: 0 auto 20px;
      padding: 0 16px;
      display: none;
    }

    #map-section.open { display: block; }

    #map-status {
      font-size: 0.82rem;
      color: var(--muted);
      padding: 8px 2px;
      text-align: center;
    }

    #map {
      height: 360px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(18, 42, 51, 0.06), 0 8px 24px rgba(18, 42, 51, 0.06);
      background: var(--card);
    }

    /* Current-weather label rendered directly on top of each marker.
       Popups (bound separately) carry the fuller breakdown. */
    .temp-marker-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--sea-deep);
      color: #EAF4F3;
      border: 2px solid #EAF4F3;
      border-radius: 999px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.74rem;
      white-space: nowrap;
      padding: 3px 8px;
      box-shadow: 0 2px 6px rgba(18, 42, 51, 0.35);
    }

    .temp-marker-pin.fallback-fetching { background: var(--muted); }

    /* --- "My location" toggle control (in-map button, top-right) --- */
    .locate-control { margin: 10px 10px 0 0; }

    .locate-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1.5px solid var(--line);
      background: #FFFFFF;
      color: var(--sea-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(18, 42, 51, 0.12), 0 4px 10px rgba(18, 42, 51, 0.12);
      transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
    }
    .locate-btn:active { transform: scale(0.94); }
    .locate-btn.active {
      background: var(--sea-deep);
      border-color: var(--sea-deep);
      color: #EAF4F3;
    }
    .locate-btn.loading { opacity: 0.6; cursor: wait; }

    /* --- "My location" marker: a little cruise ship with a pulsing wake --- */
    .user-loc-marker {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      pointer-events: none;
    }

    .user-loc-label {
      background: var(--sea-deep);
      color: #EAF4F3;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-radius: 999px;
      padding: 2px 7px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(18, 42, 51, 0.35);
    }

    .ship-pulse-wrap {
      position: relative;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ship-pulse-ring {
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      border: 2px solid var(--sand);
      animation: ship-pulse 2.2s ease-out infinite;
    }
    .ship-pulse-ring.delay { animation-delay: 1.1s; }

    @keyframes ship-pulse {
      0% { transform: scale(0.7); opacity: 0.9; }
      100% { transform: scale(2.1); opacity: 0; }
    }

    .ship-icon {
      position: relative;
      width: 28px;
      height: 28px;
      filter: drop-shadow(0 2px 3px rgba(18, 42, 51, 0.45));
      animation: ship-bob 2.4s ease-in-out infinite;
    }

    @keyframes ship-bob {
      0%, 100% { transform: translateY(0) rotate(-1.5deg); }
      50% { transform: translateY(-2px) rotate(1.5deg); }
    }

    .weather-popup h4 {
      margin: 0 0 2px;
      font-family: 'Fraunces', serif;
      font-size: 0.95rem;
      color: var(--sea-deep);
    }
    .weather-popup .popup-date {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 0 0 6px;
    }
    .weather-popup dl { margin: 0; font-size: 0.82rem; }
    .weather-popup dl div { display: flex; justify-content: space-between; gap: 14px; padding: 1px 0; }
    .weather-popup dt { color: var(--muted); }
    .weather-popup dd { margin: 0; font-weight: 600; }

    /* Below this width, the table becomes a stack of cards so nothing
       has to squeeze horizontally or scroll sideways. */
    @media (max-width: 680px) {
      table, thead, tbody, tr, th, td { display: block; }
      thead { display: none; }
      
      table {
        background: none;
        box-shadow: none;
      }

      tbody tr {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        margin-bottom: 12px;
        padding: 12px 14px;
        box-shadow: 0 1px 2px rgba(18, 42, 51, 0.05);
      }
      tbody tr:nth-child(even) { background: var(--card); }

      tbody th {
        text-align: left;
        font-size: 1rem;
        padding: 0 0 4px;
      }
      tr.today-row th { box-shadow: none; border-left: 4px solid var(--sand); padding-left: 10px; margin-left: -14px; padding-top: 2px; }

      tbody td { text-align: left; padding: 6px 0; display: flex; justify-content: space-between; align-items: baseline; }
      tbody td:nth-child(2) { font-weight: 600; padding-top: 0; padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; display: block; }
      .loc-sun { font-weight: 400; }

      td.metric::before {
        content: attr(data-label);
        font-size: 0.76rem;
        color: var(--muted);
        font-weight: 500;
      }
      .metric strong, .metric .sub { display: inline; }
      .metric .sub { margin-left: 6px; }
    }
  </style>
</head>
<body>

<header class="hero">
  <p class="eyebrow" id="trip-label"></p>
  <h1>Weather Forecast</h1>
  <div class="clock-card">
    <span class="clock-label">Current time &middot; <span id="tz-label"></span></span>
    <span class="clock-value" id="local-timeAMPM"></span>
  </div>
  <div class="actions">
    <button type="button" class="btn btn-outline" onclick="location.reload()">Refresh Page</button>
    <button type="button" class="btn btn-solid" onclick="refreshWeather()">Refresh Weather</button>
    <button type="button" class="btn btn-outline" id="map-toggle-btn" onclick="toggleMap()">Show Map</button>
  </div>
</header>
<svg class="wave" viewBox="0 0 400 20" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M0 8 Q 25 18 50 8 T 100 8 T 150 8 T 200 8 T 250 8 T 300 8 T 350 8 T 400 8 V0 H0 Z" fill="#F4F8F7"></path>
</svg>

<section id="map-section">
  <div id="map"></div>
  <div id="map-status"></div>
</section>

<main>
  <div class="wrap" style="padding:0;">
    <table>
      <thead>
        <tr>
          <th scope="col">Date</th>
          <th scope="col">Location</th>
          <th scope="col">Temp</th>
          <th scope="col">Humidity</th>
          <th scope="col">Precip</th>
          <th scope="col">Wind Gusts</th>
        </tr>
      </thead>
      <tbody id="forecast-body">
        <!-- rows are generated from CONFIG.destinations below -->
      </tbody>
    </table>
    <footer class="note"></footer>
  </div>
</main>

<script>
/* =============================================================
   TRIP CONFIG — this is the only block you should need to touch
   when planning a new trip.

   tripLabel:      Optional short label shown above the headline
                    (e.g. "Alaska & Inside Passage").
   hidePastDates:  If true (default), rows whose date has already
                    passed — in the trip timezone — are skipped
                    entirely and never fetched. Set to false to
                    always show the full itinerary.
   timezone:       IANA tz name (e.g. "America/Juneau",
                    "Europe/Rome"). Drives both the "current
                    time" clock and the Open-Meteo `timezone`
                    param for every row.
   timezoneLabel:   Plain-English label shown next to the clock
                    (e.g. "Alaska", "Europe").

   destinations:    One entry per table row, in display order.
     date         - M/D form, used to detect "today" (must match
                    real-world month/day even if dateLabel has a
                    suffix like "(pre)").
     dateLabel    - What's actually printed in the Date column.
                    Defaults to `date` if omitted.
     location     - Text shown in the Location column.
     lat / lon    - Coordinates for the forecast.
     start / end  - Forecast date(s), "YYYY-MM-DD".
     extraRow     - Optional. Use this for a second stop on the
                    same date (e.g. a port day with two legs,
                    like the old Rome/Civitavecchia case). Same
                    shape as a destination entry minus `date`.
   ============================================================= */
const CONFIG = {
  tripLabel: "Alaska & Inside Passage",
  hidePastDates: true,
  timezone: "America/Juneau",
  timezoneLabel: "Alaska",
  destinations: [
    { date: "8/23", dateLabel: "8/23 (pre)", location: "Seattle, Washington",
      lat: 47.622114, lon: -122.360331, start: "2026-08-23", end: "2026-08-23" },
    { date: "8/24", location: "Seattle, Washington",
      lat: 47.622114, lon: -122.360331, start: "2026-08-24", end: "2026-08-24" },
    { date: "8/25", location: "(at sea)",
      lat: 51.975857, lon: -128.931407, start: "2026-08-25", end: "2026-08-25" },
    { date: "8/26", location: "Ketchikan (Warden Cove), AK",
      lat: 55.366431, lon: -131.706059, start: "2026-08-26", end: "2026-08-26" },
    { date: "8/27", location: "Icy Strait Point, AK",
      lat: 58.129186, lon: -135.461978, start: "2026-08-27", end: "2026-08-27" },
    { date: "8/28", location: "Juneau, AK",
      lat: 58.29670, lon: -134.40219, start: "2026-08-28", end: "2026-08-28" },
    { date: "8/29", location: "Skagway, AK",
      lat: 59.4605, lon: -135.2911, start: "2026-08-29", end: "2026-08-29" },
    { date: "8/30", location: "Endicott Arm & Dawes Glacier, AK (at sea)",
      lat: 57.558463, lon: -133.695840, start: "2026-08-30", end: "2026-08-30" },
    { date: "8/31", location: "(at sea)",
      lat: 52.074927, lon: -129.088197, start: "2026-08-31", end: "2026-08-31" },
    { date: "9/1", location: "Victoria, BC (Canada)",
      lat: 48.423019, lon: -123.369453, start: "2026-09-01", end: "2026-09-01" },
    { date: "9/2", location: "Seattle, WA",
      lat: 47.622114, lon: -122.360331, start: "2026-09-02", end: "2026-09-02" },

    // Example of a two-row-same-date entry (kept for reference —
    // delete or adapt when needed):
    // { date: "11/1", location: "Rome, Italy",
    //   lat: 41.9028, lon: 12.4964, start: "2026-11-01", end: "2026-11-01",
    //   extraRow: { location: "Civitavecchia", lat: 42.0942, lon: 11.7955 } },
  ]
};
/* ============================================================= */

function buildApiUrl(dest) {
  return "https://api.open-meteo.com/v1/forecast"
    + `?latitude=${dest.lat}&longitude=${dest.lon}`
    + "&daily=apparent_temperature_max,apparent_temperature_min,precipitation_sum,precipitation_probability_max,wind_gusts_10m_max,wind_speed_10m_max,sunrise,sunset"
    + "&current=temperature_2m,apparent_temperature,wind_speed_10m,wind_gusts_10m,relative_humidity_2m"
    + "&models=best_match&temperature_unit=fahrenheit&precipitation_unit=inch&wind_speed_unit=mph"
    + `&timezone=${encodeURIComponent(CONFIG.timezone)}`
    + `&start_date=${dest.start}&end_date=${dest.end}`;
}

// Today's date, as YYYY-MM-DD, in the trip's timezone (not the
// viewer's local timezone) — so "today" matches the ship's clock.
function getTodayISO() {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: CONFIG.timezone,
    year: "numeric", month: "2-digit", day: "2-digit"
  }).format(new Date());
}

// CONFIG.destinations filtered down to today-or-later, when
// hidePastDates is on. `start` (YYYY-MM-DD) is compared directly
// since it's already zero-padded and sorts correctly as a string.
function visibleDestinations() {
  if (CONFIG.hidePastDates === false) return CONFIG.destinations;
  const todayISO = getTodayISO();
  return CONFIG.destinations.filter(dest => dest.start >= todayISO);
}

function makeMetricCell(label, className, id) {
  const td = document.createElement("td");
  td.className = `metric ${className}`;
  td.id = `${className}_${id}`;
  td.dataset.label = label;
  return td;
}

// Flatten destinations + any extraRow entries into one list of
// fetchable objects, each tagged with a unique `id`.
function allEntries() {
  const list = [];
  visibleDestinations().forEach((dest) => {
    list.push(dest);
    if (dest.extraRow) {
      dest.extraRow.id = `${dest.id}b`;
      dest.extraRow.start = dest.extraRow.start || dest.start;
      dest.extraRow.end = dest.extraRow.end || dest.end;
      dest.extraRow.dateId = dest.id;
      dest.extraRow.date = dest.extraRow.date || dest.date;
      dest.extraRow.dateLabel = dest.extraRow.dateLabel || dest.dateLabel;
      list.push(dest.extraRow);
    }
  });
  return list;
}

// Ids are assigned once, over the *full* (unfiltered) list, so a
// destination keeps the same id whether or not it's currently visible.
function assignIds() {
  CONFIG.destinations.forEach((dest, i) => { dest.id = `loc${i}`; });
}

function buildRows() {
  const tbody = document.getElementById("forecast-body");
  tbody.innerHTML = "";

  visibleDestinations().forEach((dest) => {
    const tr = document.createElement("tr");
    tr.dataset.date = dest.date;

    const th = document.createElement("th");
    th.scope = "row";
    th.id = `date_${dest.id}`;
    th.textContent = dest.dateLabel || dest.date;
    if (dest.extraRow) th.rowSpan = 2;
    tr.appendChild(th);

    const locTd = document.createElement("td");
    locTd.appendChild(document.createTextNode(dest.location));
    const sunSpan = document.createElement("span");
    sunSpan.className = "loc-sun";
    sunSpan.id = `sun_${dest.id}`;
    sunSpan.textContent = "Sunrise: -- \u00b7 Sunset: --";
    locTd.appendChild(sunSpan);
    tr.appendChild(locTd);

    tr.appendChild(makeMetricCell("Temp", "temperature", dest.id));
    tr.appendChild(makeMetricCell("Humidity", "humidity", dest.id));
    tr.appendChild(makeMetricCell("Precip", "precipitation", dest.id));
    tr.appendChild(makeMetricCell("Wind gusts", "windspeed", dest.id));
    tbody.appendChild(tr);

    if (dest.extraRow) {
      const extra = dest.extraRow;
      extra.id = `${dest.id}b`;
      extra.start = extra.start || dest.start;
      extra.end = extra.end || dest.end;
      // The two rows share a single (rowspan) date cell, so either
      // leg falling back to an adjusted date should flag that cell.
      extra.dateId = dest.id;

      const tr2 = document.createElement("tr");
      tr2.dataset.date = dest.date;

      const extraLocTd = document.createElement("td");
      const em = document.createElement("i");
      em.textContent = extra.location;
      extraLocTd.appendChild(em);
      const extraSunSpan = document.createElement("span");
      extraSunSpan.className = "loc-sun";
      extraSunSpan.id = `sun_${extra.id}`;
      extraSunSpan.textContent = "Sunrise: -- \u00b7 Sunset: --";
      extraLocTd.appendChild(extraSunSpan);
      tr2.appendChild(extraLocTd);

      tr2.appendChild(makeMetricCell("Temp", "temperature", extra.id));
      tr2.appendChild(makeMetricCell("Humidity", "humidity", extra.id));
      tr2.appendChild(makeMetricCell("Precip", "precipitation", extra.id));
      tr2.appendChild(makeMetricCell("Wind gusts", "windspeed", extra.id));
      tbody.appendChild(tr2);
    }

    // Refresh the badge on this row's date cell from whatever fallback
    // state is already known (set by fetchWeatherData on a prior run).
    refreshFallbackIndicator(dest);
  });
}

// Recomputes and applies the fallback-date badge for a destination's
// (possibly shared, via rowspan) date cell, folding in its extraRow
// leg if present. Safe to call before either leg has fetched yet —
// it just shows no badge until isFallbackDate is set.
function refreshFallbackIndicator(dest) {
  const extra = dest.extraRow;
  const destFallback = !!dest.isFallbackDate;
  const extraFallback = !!(extra && extra.isFallbackDate);
  const originalDates = [
    destFallback ? dest.originalStart : null,
    extraFallback ? extra.originalStart : null
  ].filter(Boolean);
  setFallbackIndicator(dest.id, destFallback || extraFallback, originalDates.join(" / "));
}

// Pulls the max allowed date out of an Open-Meteo range error, e.g.
// "Parameter 'start_date' is out of allowed range from 2026-01-01 to 2026-08-20"
function extractMaxAllowedDate(reason) {
  const match = reason && reason.match(/to (\d{4}-\d{2}-\d{2})/);
  return match ? match[1] : null;
}

// Adds or removes the "⚠" badge on a row's date cell, used to flag
// that the forecast shown is for the farthest available date rather
// than the actually-requested one. `originalDate` (if given) is shown
// in the tooltip.
function setFallbackIndicator(dateId, isFallback, originalDate) {
  const th = document.getElementById(`date_${dateId}`);
  if (!th) return;
  let badge = th.querySelector(".fallback-badge");
  if (isFallback) {
    if (!badge) {
      badge = document.createElement("span");
      badge.className = "fallback-badge";
      badge.textContent = "\u26a0";
      badge.setAttribute("aria-label", "Approximate forecast date");
      th.appendChild(badge);
    }
    badge.title = originalDate
      ? `Forecast for ${originalDate} isn't available yet — showing the closest available date instead.`
      : "Showing the closest available forecast date.";
  } else if (badge) {
    badge.remove();
  }
}

// Open-Meteo returns sunrise/sunset as local wall-clock ISO strings
// (e.g. "2026-08-23T06:03"), already adjusted for the &timezone= param.
// We parse the "HH:MM" piece directly instead of going through Date(),
// which would otherwise reinterpret it in the viewer's own timezone.
function formatClockTime(isoString) {
  if (!isoString) return "?";
  const timePart = isoString.split("T")[1];
  if (!timePart) return "?";
  const [hourStr, minStr] = timePart.split(":");
  let hour = parseInt(hourStr, 10);
  if (Number.isNaN(hour)) return "?";
  const ampm = hour >= 12 ? "PM" : "AM";
  hour = hour % 12;
  if (hour === 0) hour = 12;
  return `${hour}:${minStr} ${ampm}`;
}

async function fetchJson(url) {
  const response = await fetch(url);
  // Open-Meteo returns a JSON body with { error, reason } even on 400s,
  // so we parse the body first and decide what to do based on its contents.
  return response.json();
}

async function fetchWeatherData(dest) {
  const { id } = dest;
  try {
    let data = await fetchJson(buildApiUrl(dest));
    /*
    if (data.error) {
      if (data.reason && /out of allowed range/i.test(data.reason)) {
        const maxDate = extractMaxAllowedDate(data.reason);
        if (maxDate) {
          console.warn(`${id}: ${data.reason} — retrying with ${maxDate}`);
          // Persist the corrected date on the entry so future refreshes
          // (and this run) use it going forward.
          dest.start = maxDate;
          dest.end = maxDate;
          data = await fetchJson(buildApiUrl(dest));
        }
      }
      if (data.error) {
        throw new Error(data.reason || `${id} response was not ok`);
      }
    }
    */
    if (data.error) {
    if (data.reason && /out of allowed range/i.test(data.reason)) {
      const maxDateStr = extractMaxAllowedDate(data.reason);
      if (maxDateStr) {
        // Convert the string to a Date object
        const maxDate = new Date(maxDateStr);

        // Subtract one day safely handling month and year boundaries
        maxDate.setDate(maxDate.getDate() - 1);

        // Convert it back to a string format if your API requires it (e.g., YYYY-MM-DD)
        const adjustedDate = maxDate.toISOString().split('T')[0];

        console.warn(`${id}: ${data.reason} — retrying with ${adjustedDate}`);
        // Remember the date we actually wanted, before overwriting it,
        // so the UI can say what this row's forecast is standing in for.
        dest.originalStart = dest.originalStart || dest.start;
        dest.isFallbackDate = true;
        // Persist the corrected date on the entry so future refreshes
        // (and this run) use it going forward.
        dest.start = adjustedDate;
        dest.end = adjustedDate;
        data = await fetchJson(buildApiUrl(dest));
        setFallbackIndicator(dest.dateId || id, true, dest.originalStart);
      }
    }
    if (data.error) {
      throw new Error(data.reason || `${id} response was not ok`);
    }
  }
  
    // Rounds a value if it's an actual number; otherwise returns a dash.
    // (Math.round(x ?? "-") is a trap — Math.round("-") is NaN, not "-".)
    const round = (value, decimals = 0) => {
      //if (typeof value !== "number" || Number.isNaN(value)) return "&ndash;";
      if (typeof value !== "number" || Number.isNaN(value)) return "?";
      const factor = 10 ** decimals;
      return Math.round(value * factor) / factor;
    };

    const tempActual = round(data.current?.temperature_2m);
    const max = round(data.daily?.apparent_temperature_max?.[0]);
    const min = round(data.daily?.apparent_temperature_min?.[0]);
    const rain = round(data.daily?.precipitation_sum?.[0], 1);
    const rainProb = round(data.daily?.precipitation_probability_max?.[0]);
    const gust = round(data.daily?.wind_gusts_10m_max?.[0]);
    const windSpeed = round(data.daily?.wind_speed_10m_max?.[0]);
    const humidity = round(data.current?.relative_humidity_2m);
    const apparentNow = round(data.current?.apparent_temperature);
    const sunrise = formatClockTime(data.daily?.sunrise?.[0]);
    const sunset = formatClockTime(data.daily?.sunset?.[0]);

    // Kept on the entry (rather than only written to the DOM) so the
    // map — lazy-loaded and possibly opened before or after this pass —
    // can render current conditions without a separate fetch.
    dest.weather = { tempActual, min, max, humidity, apparentNow, rainProb, rain, gust, windSpeed, sunrise, sunset };
    if (typeof refreshMapMarker === "function") refreshMapMarker(dest);

    document.getElementById(`temperature_${id}`).innerHTML = `<span class="metric-value"><strong>${tempActual}&deg;F</strong><span class="sub"> Low: ${min} &ndash; High: ${max}&deg;</span></span>`;
    document.getElementById(`humidity_${id}`).innerHTML = `<span class="metric-value"><strong>${humidity}%</strong><span class="sub">Feels ${apparentNow}&deg;</span></span>`;
    document.getElementById(`precipitation_${id}`).innerHTML = `<span class="metric-value"><strong>${rainProb}%</strong><span class="sub">${rain} in</span></span>`;
    document.getElementById(`windspeed_${id}`).innerHTML = `<span class="metric-value"><strong>${gust} mph</strong><span class="sub">${windSpeed} mph sustained</span></span>`;
    const sunEl = document.getElementById(`sun_${id}`);
    if (sunEl) sunEl.textContent = `Sunrise: ${sunrise} \u00b7 Sunset: ${sunset}`;
  } catch (error) {
    console.error(`Error loading forecast for ${id}:`, error.message);
    document.getElementById(`temperature_${id}`).innerHTML = `<span class="metric-value"><strong>? &deg;F</strong><span class="sub"> Low: ? &ndash; High: ?&deg;</span></span>`;
    document.getElementById(`humidity_${id}`).innerHTML = `<span class="metric-value"><strong>?%</strong><span class="sub">Feels ?&deg;</span></span>`;
    document.getElementById(`precipitation_${id}`).innerHTML = `<span class="metric-value"><strong>?%</strong><span class="sub">? in</span></span>`;
    document.getElementById(`windspeed_${id}`).innerHTML = `<span class="metric-value"><strong>? mph</strong><span class="sub">? mph sustained</span></span>`;
    const sunEl = document.getElementById(`sun_${id}`);
    if (sunEl) sunEl.textContent = "Sunrise: ? \u00b7 Sunset: ?";
  }
}

async function fetchAll() {
  const entries = allEntries();
  await Promise.allSettled(entries.map(fetchWeatherData));
  updateFallbackFooter(entries);
}

// After a fetch pass completes, explain the ⚠ badge in the footer,
// but only when at least one row is actually using a fallback date.
function updateFallbackFooter(entries) {
  const footer = document.querySelector("footer.note");
  if (!footer) return;
  const anyFallback = entries.some(entry => entry.isFallbackDate);
  footer.textContent = anyFallback
    ? "\u26a0 = forecast not yet available"
    : "";
}

// Display the current time in CONFIG.timezone
function updateLocalTime() {
  const now = new Date();
  const optionsAMPM = { timeZone: CONFIG.timezone, hour: "2-digit", minute: "2-digit", hour12: true };
  const options24 = { timeZone: CONFIG.timezone, hour: "2-digit", minute: "2-digit", hour12: false };
  const formatterAMPM = new Intl.DateTimeFormat("en-US", optionsAMPM);
  const formatter24 = new Intl.DateTimeFormat("en-US", options24);
  document.getElementById("local-timeAMPM").textContent = `${formatterAMPM.format(now)} (${formatter24.format(now)})`;
}

function highlightToday() {
  const today = new Date();
  const todayDate = `${today.getMonth() + 1}/${today.getDate()}`;
  document.querySelectorAll("tr.today-row").forEach(tr => tr.classList.remove("today-row"));
  document.querySelectorAll(`tr[data-date="${todayDate}"]`).forEach(tr => tr.classList.add("today-row"));
}

function refreshWeather() {
  console.log("Updating weather...");
  // Rebuild first, in case a date has passed since the page loaded
  // (e.g. it's been open across midnight) — this re-applies the
  // past-date filter and resets every cell to its loading state.
  buildRows();
  fetchAll();
  highlightToday();
  pruneMapMarkers();
}

// Removes markers for any destination hidePastDates has since filtered
// out of the table (e.g. the trip clock rolled past midnight), so the
// map doesn't accumulate pins for stops that are no longer shown.
function pruneMapMarkers() {
  if (!mapState.map) return;
  const visibleIds = new Set(allEntries().map((d) => d.id));
  Object.keys(mapState.markers).forEach((id) => {
    if (!visibleIds.has(id)) {
      mapState.map.removeLayer(mapState.markers[id]);
      delete mapState.markers[id];
    }
  });
}

// ---------------- Map (Leaflet, lazy-loaded) ----------------
// Nothing map-related (JS, CSS, tiles) is requested until the user taps
// "Show Map" — the app stays light for low-connectivity use until then.
let mapState = { loaded: false, loading: null, map: null, markers: {}, userMarker: null, locating: false, locateBtn: null };

function toggleMap() {
  const section = document.getElementById("map-section");
  const btn = document.getElementById("map-toggle-btn");
  const opening = !section.classList.contains("open");

  if (!opening) {
    section.classList.remove("open");
    btn.textContent = "Show Map";
    return;
  }

  section.classList.add("open");
  btn.textContent = "Hide Map";

  if (mapState.loaded) {
    // Leaflet measures its container at init time; since the container
    // was display:none, it needs a nudge now that it's visible again.
    setTimeout(() => mapState.map && mapState.map.invalidateSize(), 0);
    return;
  }

  const statusEl = document.getElementById("map-status");
  statusEl.textContent = "Loading map\u2026";
  loadLeaflet()
    .then(initMap)
    .then(() => { statusEl.textContent = ""; })
    .catch((err) => {
      console.error("Map failed to load:", err);
      statusEl.textContent = "Map failed to load \u2014 check your connection.";
    });
}

function loadLeaflet() {
  if (mapState.loading) return mapState.loading;
  mapState.loading = new Promise((resolve, reject) => {
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    document.head.appendChild(css);

    const script = document.createElement("script");
    script.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    script.onload = () => resolve();
    script.onerror = () => reject(new Error("Leaflet script failed to load"));
    document.head.appendChild(script);
  });
  return mapState.loading;
}

function initMap() {
  mapState.loaded = true;
  mapState.map = L.map("map", { scrollWheelZoom: false });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(mapState.map);

  allEntries().forEach(addOrUpdateMarker);
  fitMapToMarkers();
  addLocateControl();
}

// A small button on the map itself (top-right) that toggles the
// "my location" ship marker on/off — location is never requested
// automatically, only when the person opts in here.
function addLocateControl() {
  const LocateControl = L.Control.extend({
    options: { position: "topright" },
    onAdd: function () {
      const wrapper = L.DomUtil.create("div", "locate-control");
      const btn = L.DomUtil.create("button", "locate-btn", wrapper);
      btn.type = "button";
      btn.setAttribute("aria-pressed", "false");
      btn.title = "Show my location";
      btn.textContent = "\ud83d\udea2"; // ship emoji, swapped for the custom SVG on the map marker itself
      L.DomEvent.disableClickPropagation(wrapper);
      L.DomEvent.on(btn, "click", toggleLocate);
      mapState.locateBtn = btn;
      return wrapper;
    }
  });
  new LocateControl().addTo(mapState.map);
}

// Small pill showing *current* temperature only, rendered on top of the
// marker itself. The fuller current-conditions breakdown lives in the
// popup (see popupHtml) rather than on the map face.
function tempPinIcon(dest) {
  const label = dest.weather ? `${dest.weather.tempActual}\u00b0` : "\u2026";
  const cls = dest.weather ? "temp-marker-pin" : "temp-marker-pin fallback-fetching";
  return L.divIcon({ className: "", html: `<div class="${cls}">${label}</div>`, iconSize: null, iconAnchor: [18, 12] });
}

function popupHtml(dest) {
  const dateText = dest.dateLabel || dest.date || "";
  const w = dest.weather;
  if (!w) {
    return `<div class="weather-popup"><h4>${dest.location}</h4><div class="popup-date">${dateText}</div>Fetching current conditions&hellip;</div>`;
  }
  return `<div class="weather-popup">
    <h4>${dest.location}</h4>
    <div class="popup-date">${dateText}</div>
    <dl>
      <div><dt>Temp</dt><dd>${w.tempActual}&deg;F (feels ${w.apparentNow}&deg;)</dd></div>
      <div><dt>Humidity</dt><dd>${w.humidity}%</dd></div>
      <div><dt>Wind gusts</dt><dd>${w.gust} mph</dd></div>
      <div><dt>Rain chance</dt><dd>${w.rainProb}%</dd></div>
      <div><dt>Sun</dt><dd>${w.sunrise} &middot; ${w.sunset}</dd></div>
    </dl>
  </div>`;
}

function addOrUpdateMarker(dest) {
  if (typeof dest.lat !== "number" || typeof dest.lon !== "number") return;
  if (!mapState.map) return;

  const existing = mapState.markers[dest.id];
  if (existing) {
    existing.setIcon(tempPinIcon(dest));
    existing.setPopupContent(popupHtml(dest));
    return;
  }

  const marker = L.marker([dest.lat, dest.lon], { icon: tempPinIcon(dest) })
    .bindPopup(popupHtml(dest))
    .addTo(mapState.map);
  mapState.markers[dest.id] = marker;
}

// Called from fetchWeatherData as each destination's data comes back.
// No-ops harmlessly if the map hasn't been opened (and thus loaded) yet.
function refreshMapMarker(dest) {
  if (!mapState.map) return;
  addOrUpdateMarker(dest);
}

function fitMapToMarkers() {
  const points = Object.values(mapState.markers).map((m) => m.getLatLng());
  if (mapState.userMarker) points.push(mapState.userMarker.getLatLng());
  if (points.length === 0) return;
  if (points.length === 1) {
    mapState.map.setView(points[0], 9);
  } else {
    mapState.map.fitBounds(L.latLngBounds(points), { padding: [24, 24] });
  }
}

// A small stylized cruise ship, drawn with the site's own palette so it
// reads as "your ship" rather than a generic map pin.
const SHIP_SVG = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <path d="M3.5 15.5h17l-2 4.2a2 2 0 0 1-1.8 1.15H7.3a2 2 0 0 1-1.8-1.15l-2-4.2Z" fill="#0E4048"/>
  <rect x="6.5" y="9.5" width="11" height="6" rx="1" fill="#EAF4F3" stroke="#0E4048" stroke-width="1"/>
  <rect x="8.7" y="10.7" width="2.2" height="2" fill="#1F6F78"/>
  <rect x="13.1" y="10.7" width="2.2" height="2" fill="#1F6F78"/>
  <rect x="10" y="5" width="2.4" height="4.7" rx="0.5" fill="#0E4048"/>
  <rect x="9.4" y="3.2" width="3.6" height="2" rx="0.4" fill="#E3A542"/>
  <path d="M2 17.3c1 .75 2 .75 3 0s2 .75 3 0 2 .75 3 0 2 .75 3 0 2 .75 3 0 2 .75 3 0" stroke="#1F6F78" stroke-width="1.3" stroke-linecap="round" fill="none"/>
</svg>`;

function toggleLocate() {
  if (mapState.locating) {
    unlocateMe();
  } else {
    locateMe();
  }
}

function setLocateBtnState(active, title) {
  const btn = mapState.locateBtn;
  if (!btn) return;
  btn.classList.remove("loading");
  btn.classList.toggle("active", active);
  btn.setAttribute("aria-pressed", String(active));
  btn.title = title;
}

// Requests location only when the user taps the map's locate button —
// never automatically — then pans/zooms to it (Leaflet zoom level 7)
// and drops a pulsing cruise-ship marker.
function locateMe() {
  const statusEl = document.getElementById("map-status");
  if (!navigator.geolocation) {
    if (statusEl) statusEl.textContent = "Your browser doesn't support location.";
    return;
  }
  if (mapState.locateBtn) mapState.locateBtn.classList.add("loading");

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const latlng = [pos.coords.latitude, pos.coords.longitude];
      if (mapState.userMarker) mapState.map.removeLayer(mapState.userMarker);

      const icon = L.divIcon({
        className: "",
        html: `<div class="user-loc-marker">
                 <div class="ship-pulse-wrap">
                   <span class="ship-pulse-ring"></span>
                   <span class="ship-pulse-ring delay"></span>
                   <span class="ship-icon">${SHIP_SVG}</span>
                 </div>
                 <div class="user-loc-label">You</div>
               </div>`,
        iconSize: null,
        iconAnchor: [17, 17]
      });
      mapState.userMarker = L.marker(latlng, { icon, zIndexOffset: 1000 })
        .bindPopup("Your current location")
        .addTo(mapState.map)
        .openPopup();

      mapState.map.setView(latlng, 7, { animate: true });
      mapState.locating = true;
      setLocateBtnState(true, "Hide my location");
      if (statusEl) statusEl.textContent = "";
    },
    (err) => {
      console.warn("Location unavailable:", err.message);
      if (statusEl) statusEl.textContent = "Couldn't get your location \u2014 check location permissions.";
      setLocateBtnState(false, "Show my location");
    },
    { timeout: 8000 }
  );
}

// Removes the ship marker and hands the view back to the destinations.
function unlocateMe() {
  if (mapState.userMarker) {
    mapState.map.removeLayer(mapState.userMarker);
    mapState.userMarker = null;
  }
  mapState.locating = false;
  setLocateBtnState(false, "Show my location");
  fitMapToMarkers();
}

// --- init ---
document.getElementById("tz-label").textContent = CONFIG.timezoneLabel || CONFIG.timezone;
document.getElementById("trip-label").textContent = CONFIG.tripLabel || "";
assignIds();
buildRows();
fetchAll();
highlightToday();
setInterval(updateLocalTime, 1000);
</script>

</body>
</html>
